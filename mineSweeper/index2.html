<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style2.css">
        <title>マインスイーパ2</title>
    </head>
    <body>
        <main>
            <div id="top">
                <h1>マインスイーパ2</h1>
                <ol id="selectMode">
                    <li class="easy">
                        初級<br>
                        8×8マス　地雷:15<br>
                        <button>PLAY</button>
                    </li>
                    <li class="normal">
                        中級<br>
                        12×12マス　地雷:35<br>
                        <button>PLAY</button>
                    </li>
                    <li class="hard">
                        上級<br>
                        16×16マス　地雷:50<br>
                        <button>PLAY</button>
                    </li>
                    <li class="custom">
                        カスタム<br>
                        一辺のマス数: <input type="text" name="side"><br>
                        地雷: <input type="text" name="mine"><br>
                        <button>PLAY</button>
                    </li>
                </ol>
                <p>カスタムモードは、(一辺のマス数の2乗-9) >= 地雷になるように設定してください。</p>
            </div>
            <div id="game">
                <div id="playArea"><!--JavaScriptで記述（プレイエリア生成）--></div>
                <div id="sideArea">
                    <div id="buttons">
                        <button id="flag"><img src="flag_white_sankaku1.png"></button>
                        <button id="hint"><img src="denkyuu_on.png"></button>
                    </div>
                    <ol id="restHint"><!--JavaScriptで記述(残りヒント生成)--></ol>
                    <div id="msgArea">
                        <p>地雷の数: <span id="numMine"></span></p>
                        <p>フラッグの数:<span id="numFlag">0</span></p>
                        <p id="result"></p>
                        <p id="time">クリア時間は<span id="minutes"></span>分<span id="seconds"></span>秒です。</p>
                        <button id="returnTop">トップへ戻る</button>
                    </div>
                </div>
            </div>
        </main>
        <script src="../scripts/jquery-3.7.1.min.js"></script>
        <script>
            'use strick';

            let side;  //一辺のマス数
            let numMine;    //地雷の数

            $('#top li button').on('click', function(){
                document.getElementById('top').style='display: none';
                document.getElementById('game').style='display: flex';
                if($(this).parent().hasClass('easy')){
                    side = 8;
                    numMine = 15;
                } else if($(this).parent().hasClass('normal')){
                    side = 12;
                    numMine = 35;
                } else if($(this).parent().hasClass('hard')){
                    side = 16;
                    numMine = 50;
                } else if($(this).parent().hasClass('custom')){
                    event.preventDefault();
                    side=document.querySelector('input[name="side"]').val();
                    numMine=document.querySelector('input[name="mine"]').val();
                }
                game();
            })

            $('#returnTop').on('click', function(){
                document.getElementById('hint').style='background-color: auto';
                document.querySelectorAll('#restHint li').forEach(function(item, index) {
                    item.remove();
                });
                // querySelectorAll()で取得したデータは配列のような形だから、そのままremove()が使えない。
                document.getElementById('result').textContent='';
                document.getElementById('time').style='display: none';
                document.getElementById('returnTop').style='display: none';
                document.querySelectorAll('#playArea .row').forEach(function(item, index) {
                    item.remove()
                })
                document.getElementById('game').style='display: none';
                document.getElementById('top').style='display: block';
            })

            function game() {
                let box=[];
                let numOpen=0;
                let numFlag=0;
                let startTime;
                let first=true;
                let finish=false;
                let restHint=5;

                document.getElementById('numMine').textContent=numMine;
                document.getElementById('numFlag').textContent=numFlag;

                //プレイエリア生成
                for(let i=0; i<side; i++) {
                    document.getElementById('playArea').insertAdjacentHTML('beforeend', `<div class="row"></div>`)

                    box[i]=[];
                    for(let j=0; j<side; j++) {
                        box[i][j]={row: i, column: j, mine: false, flag: false, open: false, first:false, around: 0};
                        document.querySelector(`.row:nth-child(${i+1})`).insertAdjacentHTML
                            ('beforeend', `<span class="box" data-row="${i}" data-column="${j}"></span>`);
                    }
                }
                //残りヒント生成
                for(let i=1; i<=restHint; i++){
                    document.getElementById('restHint').insertAdjacentHTML('beforeend', '<li><img src="denkyuu_on.png"></li>')
                }

                //旗クリック
                $('#flag').off('click');
                $('#flag').on('click', function(){
                    this.classList.toggle('pushed');
                    if(document.getElementById('hint').classList.contains('pushed')) {
                        document.getElementById('hint').classList.remove('pushed');
                    }
                })
                //ヒントクリック
                $('#hint').off('click');
                $('#hint').on('click', function(){
                    if(restHint>0){
                        this.classList.toggle('pushed');
                        if(document.getElementById('flag').classList.contains('pushed')) {
                            document.getElementById('flag').classList.remove('pushed');
                        }
                    }
                })

                // boxをクリック
                $('.box').off('click');
                $('.box').on('click', function(){
                    // clickedに代入
                    const row=this.dataset.row;
                    const column=this.dataset.column;
                    const clicked = box[row][column];
                    console.log(clicked);
                    if(finish===false && clicked.open===false) {
                        // フラッグON
                        if(document.getElementById('flag').classList.contains('pushed')) {
                            this.classList.toggle('flag');
                            if(this.classList.contains('flag')){
                                numFlag++;
                            } else {
                                numFlag--;
                            }
                            document.getElementById('numFlag').textContent = numFlag;
                        } else 
                        //ヒントON
                        if(document.getElementById('hint').classList.contains('pushed')) {
                            if(restHint>0) {
                                this.classList.add('open');
                                if(clicked.mine) {
                                    this.classList.add('mine');
                                } else if(clicked.around>0) {
                                    this.classList.add(`around${clicked.around}`);
                                }
                                document.querySelector(`#restHint li:nth-child(${restHint}) img`).src='denkyuu_off.png';
                                setTimeout(() => {
                                    this.classList.remove('open', 'mine', `around${clicked.around}`);
                                    restHint--;
                                    document.getElementById('hint').classList.remove('pushed');
                                    if(restHint===0){
                                        document.getElementById('hint').style='background-color: gray';
                                    }
                                }, 2000);
                            }
                        } else
                        // 通常（初回時）
                        if(first) {
                            first=false;
                            clicked.open=true;
                            $(this).addClass('open');
                            numOpen++;
                            clicked.first=true;
                            startTime=new Date();
                            //mineを設置
                            let i=0;
                            while(i<numMine) {
                                const mineX = Math.floor(Math.random()*side);
                                const mineY = Math.floor(Math.random()*side);
                                if((!box[mineX][mineY].first)&&(!box[mineX][mineY].mine)) {
                                    if(Math.abs(mineX-row)>=2||Math.abs(mineY-column)>=2) {
                                        box[mineX][mineY].mine=true;
                                        i++;
                                    }
                                }
                            }
                            //aroundを設定
                            for(let i=0; i<side; i++) {
                                for(let j=0; j<side; j++) {
                                    let around=0;
                                    if((i-1>=0)&&(j-1>=0)) {
                                        if(box[i-1][j-1].mine){around++};}
                                    if(i-1>=0) {
                                        if(box[i-1][j].mine){around++};}
                                    if((i-1>=0)&&(j+1<side)) {
                                        if(box[i-1][j+1].mine){around++};}
                                    if(j-1>=0) {
                                        if(box[i][j-1].mine){around++};}
                                    if(box[i][j].mine){around++};
                                    if(j+1<side) {
                                        if(box[i][j+1].mine){around++};}
                                    if((i+1<side)&&(j-1>=0)) {
                                        if(box[i+1][j-1].mine){around++};}
                                    if(i+1<side) {
                                        if(box[i+1][j].mine){around++};}
                                    if((i+1<side)&&(j+1<side)) {
                                        if(box[i+1][j+1].mine){around++};}
                                    box[i][j].around=around;
                                    // 存在しない要素を指定はできたが、存在しない配列を指定することはできない。(box[-1][-1]など)
                                    // そのため、見た目は汚いが値が0以上side未満かの判定を加えた。
                                }
                            }
                        } else {
                            //通常（2回目以降）
                            if(!this.classList.contains('flag')) {
                                clicked.open=true;
                                this.classList.add('open');
                                if(clicked.mine) {
                                    //失敗
                                    this.classList.add("mine");
                                    finish=true;
                                    document.getElementById('result').textContent='失敗...';
                                    document.getElementById('returnTop').style='display: block';
                                } else {
                                    //成功
                                    numOpen++;
                                    if(clicked.around>0) {
                                        this.classList.add(`around${clicked.around}`);
                                    }
                                }
                            }
                            if(numOpen === side**2-numMine) {
                                //ゲームクリア
                                finish=true;
                                document.getElementById('result').textContent='クリア!';
                                document.getElementById('returnTop').style='display: block';
                                //クリアタイムを表示
                                const clearTime = new Date();
                                const time = clearTime.getTime() - startTime.getTime();
                                document.getElementById('time').style='display: block';
                                const minutes = Math.floor(time/1000/60)%60;
                                const seconds = Math.floor(time/1000)%60;
                                document.getElementById('minutes').textContent=Math.floor(time/1000/60)%60;
                                document.getElementById('seconds').textContent=Math.floor(time/1000)%60;
                            }
                        }
                    }
                })
            }
        </script>
    </body>

</html>
