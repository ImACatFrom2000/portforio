<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>rhythm1</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }
            canvas {
                background: #000000;
                display: block;
                margin: 0 auto;
            }
            p {
                font-size: larger;
                text-align: center;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <canvas id="myCanvas" width="300" height="500"></canvas>
        <p>BPM : <span id="bpm"></span></p>
        <script>
            'use strict';
            const canvas = document.getElementById("myCanvas");
            const ctx = canvas.getContext("2d");

            const bpm = 180;
            const beat = 60000 / bpm;

            function draw() {
                ctx.beginPath();
                ctx.arc(canvas.width/2, canvas.height/2, 10, 0, Math.PI * 2);
                ctx.fillStyle = "#ff0000";
                ctx.fill();
                setTimeout(() => {
                    ctx.fillStyle = "#fff";
                    ctx.fill();
                }, 50);
                ctx.closePath();
            }
            draw();
            setInterval(draw, beat);
            document.getElementById('bpm').textContent = bpm;
        </script>
    </body>
</html>
